buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath 'com.android.tools.build:gradle:8.3.0'
  }
}

apply plugin: 'com.android.library'

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
  namespace 'com.arthenica.ffmpegkit.reactnative'
  compileSdkVersion 36

  defaultConfig {
    minSdkVersion 24
    targetSdkVersion 36
    versionCode 3
    versionName "0.3.0"
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }
  lintOptions {
    disable 'GradleCompatible'
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  repositories {
    flatDir {
      dirs 'libs'
    }
  }
}

repositories {
  mavenCentral()
  google()

  def androidSourcesName = 'React Native sources'
  def androidSourcesRoot = null

  def findReactNativeAndroidDir = { File base, int depth ->
    def current = base
    depth.times {
      if (current == null) return null
      def candidate = new File(current, 'node_modules/react-native/android')
      if (candidate.exists()) {
        return candidate
      }
      current = current.parentFile
    }
    return null
  }

  if (rootProject.ext.has('reactNativeAndroidRoot')) {
    androidSourcesRoot = new File(rootProject.ext.get('reactNativeAndroidRoot'))
  } else {
    def searchRoots = [projectDir, rootProject.projectDir, rootProject.rootDir]
    searchRoots.any { root ->
      if (root == null) return false
      def candidate = findReactNativeAndroidDir(root, 6)
      if (candidate != null) {
        androidSourcesRoot = candidate
        return true
      }
      return false
    }
  }

  if (androidSourcesRoot != null && androidSourcesRoot.exists()) {
    maven {
      url androidSourcesRoot.toString()
      name androidSourcesName
    }
  } else {
    logger.warn("${project.name}: React Native android sources not found. " +
      "Gradle will fall back to the published React Native AAR, but you can set " +
      "reactNativeAndroidRoot in your root project's ext block if needed.")
  }
}

dependencies {
  api 'com.facebook.react:react-native:+'
  implementation(name: 'ffmpeg-kit-6.x', ext: 'aar')
}
